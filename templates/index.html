<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/about-us">About Us</a>
        <a href="{% url 'add_task' %}">New Task</a>
        <a href="/login">Login</a>
        <a href="{% url 'signup' %}">Register</a>
    </nav>
    <h1>Welcome to Django Tutorial</h1>
    {{user_name}}
    <ul class="task-list">
        {% for task in my_task %}
            <li>{{task.task}} - {% if task.is_completed %}Completed{% else %}Incomplete{% endif %}
                <a href="/delete/{{task.id}}">Delete</a>
                <a href="{% url 'update_task' task.id %}">Update</a>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
