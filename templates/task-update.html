<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <div>
            <label>Task</label>
            <input type="text" name="task" value="{{my_task.task}}">
        </div>

        <div>
            <label>Is Completed</label>
            <input type="checkbox" name="status" value="True" {% if my_task.is_completed%}checked{% endif %}>
        </div>
        <div>
            <input type="submit" value="Save Changes">
        </div>
    </form>
</body>
</html>
